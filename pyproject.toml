[project]
name = "questai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gabriel", email = "gabrielfernandess0321@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.7.2",
    "langchain[mcp]>=1.4.7",
    "pydantic-settings>=2.16.1",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
questai = "questai:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
